name: CI

# CI (테스트/빌드) 전용 워크플로.
# - push / pull_request 시 단독 실행
# - worklog.yml 에서 workflow_call 로 재사용 (test 결과를 기록에 전달)
on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_call:
    outputs:
      test_passed:
        description: '백엔드 테스트 통과 여부 (true/false)'
        value: ${{ jobs.build-test.outputs.test_passed }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      test_passed: ${{ steps.result.outputs.test_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend tests
        id: test
        run: ./gradlew :backend:test

      - name: Build backend jar
        if: success()
        run: ./gradlew :backend:bootJar

      - name: Mark test result
        id: result
        if: always()
        run: echo "test_passed=${{ steps.test.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco
          if-no-files-found: ignore
          retention-days: 14
