spring:
  config:
    import: optional:file:.env.${spring.profiles.active}[.properties]
  web:
    resources:
      add-mappings: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    prefix: "classpath:/mail/"
    suffix: ".html"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-name: Github
            authorization-grant-type: authorization_code
            scope: read:user, user:email, repo, read:org
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      lettuce:
        shutdown-timeout: 5000ms
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
    mongodb:
      host: ${MONGODB_HOST}
      port: ${MONGODB_PORT}
      database: ${MONGODB_DATABASE}
      auto-index-creation: false
      uuid-representation: standard

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual

encryption:
  password: ${ENCRYPTION_PASSWORD}
  salt: ${ENCRYPTION_SALT}

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}
    custom_domain: ${AWS_S3_CUSTOM_DOMAIN}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration:
    access: ${JWT_EXPIRATION_ACCESS}
    refresh: ${JWT_EXPIRATION_REFRESH}
    signup: ${JWT_EXPIRATION_SIGNUP}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

slack:
  logging:
    error: ${SLACK_LOGGING_ERROR_WEBHOOK_URL}
  event-notification-url: ${SLACK_EVENT_NOTIFICATION_URL}

server:
  shutdown: graceful
  # 기본 오류 응답(BasicErrorController)에 스택트레이스·예외 클래스·내부 메시지를 싣지 않는다.
  # devtools 가 의존성에 있어 활성화되면 include-stacktrace 기본값을 always 로 바꾸므로 명시적으로 막는다.
  # 운영 서버의 활성 프로필(dev/prod)과 무관하게 적용되도록 공통 설정에 둔다.
  # (GlobalException 등 @ExceptionHandler 가 만드는 응답 메시지에는 영향 없음)
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  tomcat:
    max-http-form-post-size: 10MB
  servlet:
    encoding:
      force-response: true

springdoc:
  swagger-ui:
    persist-authorization: true
    disable-swagger-default-url: true

  default-produces-media-type: application/json
